services:
  - type: web
    name: dems-backend
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y libmagic1
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements-render.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      # Use the environment variables to create the superuser
      python manage.py createsuperuser --noinput || true
    startCommand: daphne -b 0.0.0.0 -p $PORT dems_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DJANGO_SETTINGS_MODULE
        value: dems_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      # These three variables tell createsuperuser exactly what to create
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Sntu@6960
      - key: DATABASE_URL
        fromDatabase:
          name: dems-db
          property: connectionString

databases:
  - name: dems-db
    plan: free
    databaseName: dems_db
    user: dems_user
