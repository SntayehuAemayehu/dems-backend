services:
  - type: web
    name: dems-backend
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y libmagic1
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements-render.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); u, _ = User.objects.get_or_create(email='admin@gmail.com'); u.set_password('Sntu@6960'); u.full_name='Admin User'; u.is_staff=True; u.is_superuser=True; u.is_active=True; u.save()"
    startCommand: daphne -b 0.0.0.0 -p $PORT dems_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DJANGO_SETTINGS_MODULE
        value: dems_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: dems-db
          property: connectionString

databases:
  - name: dems-db
    plan: free
    databaseName: dems_db
    user: dems_user
