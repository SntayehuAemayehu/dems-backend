services:
  - type: web
    name: dems-backend
    env: python
    plan: free
buildCommand: |
  apt-get update && apt-get install -y libmagic1
  cd backend
  pip install --upgrade pip
  pip install --no-cache-dir -r requirements-render.txt
  python manage.py collectstatic --noinput
  python manage.py migrate --noinput
  python manage.py createsuperuser --noinput || true
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT dems_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DJANGO_SETTINGS_MODULE
        value: dems_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://dems-frontend.onrender.com,http://localhost:3000
      - key: EMAIL_HOST_USER
        value: sntualex@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: ozngfsecuztuoptr
      - key: DATABASE_URL
        fromDatabase:
          name: dems-db
          property: connectionString

databases:
  - name: dems-db
    plan: free
    databaseName: dems_db
    user: dems_user
