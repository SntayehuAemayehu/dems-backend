services:
  - type: web
    name: dems-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn dems_backend.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dems-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://dems-frontend.onrender.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
    healthCheckPath: /api/health/

  - type: web
    name: dems-frontend
    env: static
    buildCommand: |
      cd ../frontend && npm install && npm run build
    staticPublishPath: ../frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://dems-backend.onrender.com/api

databases:
  - name: dems-db
    databaseName: dems_db
    user: dems_user
    plan: free