services:
  - type: web
    name: dems-backend
    env: python
    buildCommand: pip install --no-cache-dir -r requirements-render.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn dems_backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: dems-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://dems-frontend.onrender.com,http://localhost:3000
      - key: EMAIL_HOST_USER
        value: sntualex@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: ozngfsecuztuoptr